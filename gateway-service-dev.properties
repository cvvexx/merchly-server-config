merchly.uri.product-service=${PRODUCT_SERVICE_URI:http://localhost:8081}
merchly.uri.user-service=${USER_SERVICE_URI:http://localhost:8082}
merchly.uri.review-service=${REVIEW_SERVICE_URI:http://localhost:8083}
merchly.uri.order-service=${ORDER_SERVICE_URI:http://localhost:8084}
merchly.uri.frontend-service=${FRONTEND_SERVICE_URI:http://localhost:8080}

# Токены, приходящие на /api/** от сервисов, шлюз проверяет сам.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/merchly}

# Своего OAuth2-клиента у шлюза нет: в Keycloak он ходит собственным
# KeycloakRestClient по этим адресам — password grant при входе и
# отзыв refresh-токена при выходе.
keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8090/realms/merchly/protocol/openid-connect/token}
keycloak.logout-uri=${KEYCLOAK_LOGOUT_URI:http://localhost:8090/realms/merchly/protocol/openid-connect/logout}
