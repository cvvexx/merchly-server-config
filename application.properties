# ============================================================
# Общие настройки для ВСЕХ сервисов Merchly, всех профилей.
# Config Server отдаёт этот файл первым, поверх него ложатся
# <service>.properties, затем <service>-<profile>.properties.
# ============================================================

logging.level.org.springframework.security=DEBUG

# Redis: хост задаётся в application-<profile>.properties
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
